<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>TOMS Customer Satisfaction Survey</title>

  <style>
    :root {
      --gas-banner-cut: 58px;
      --shell-bg: #eef4f8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--shell-bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;

      overscroll-behavior: none;
    }

    .shell {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      overflow: hidden;
      background: var(--shell-bg);
    }

    .frame-clip {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      background: var(--shell-bg);
    }

    #appFrame {
      position: absolute;

      left: 0;
      top: calc(-1 * var(--gas-banner-cut));

      width: 100%;
      height: calc(100vh + var(--gas-banner-cut));
      height: calc(100dvh + var(--gas-banner-cut));

      margin: 0;
      padding: 0;
      border: 0;

      display: block;

      background: #fff;
      opacity: 0;

      transition: opacity 220ms ease;
    }

    .shell.ready #appFrame {
      opacity: 1;
    }

    .loader {
      position: absolute;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--shell-bg);

      opacity: 1;
      visibility: visible;

      transition:
        opacity 260ms ease,
        visibility 260ms ease;
    }

    .shell.ready .loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      color: #0b3b68;

      font-family:
        Arial,
        "Noto Sans Thai",
        Tahoma,
        sans-serif;

      text-align: center;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border: 4px solid #d6e4ee;
      border-top-color: #0b5c97;
      border-radius: 50%;

      animation: spin .75s linear infinite;
    }

    .loading-text {
      font-size: 12px;
      font-weight: 700;
      color: #6b8295;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /*
     * Mobile Safari/Chrome:
     * the Apps Script banner is slightly shorter than desktop.
     * Keep iframe full-width; do not add safe-area padding around it.
     */
    @media (max-width: 760px) {
      :root {
        --gas-banner-cut: 54px;
      }

      #appFrame {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #appFrame,
      .loader {
        transition: none;
      }

      .spinner {
        animation-duration: 1.4s;
      }
    }
  </style>
</head>

<body>
  <main
    class="shell"
    id="shell"
  >
    <div class="frame-clip">
      <iframe
        id="appFrame"
        title="TOMS Customer Satisfaction Survey"
        src="about:blank"
        allow="fullscreen"
        allowfullscreen
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>

    <div
      class="loader"
      id="loader"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="loader-inner">
        <div
          class="spinner"
          aria-hidden="true"
        ></div>
        <div class="loading-text">
          Loading TOMS Survey...
        </div>
      </div>
    </div>
  </main>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbz6MUKdWbD2z1Eld5K9yHo_mKSX7bvHknE6tg7j0tvPexsJY_7gORG6fq7L49kXT7OtCA/exec";

    const shell =
      document.getElementById(
        "shell"
      );

    const frame =
      document.getElementById(
        "appFrame"
      );

    const loader =
      document.getElementById(
        "loader"
      );


    function latestAppUrl() {
      /*
       * Always request the current Apps Script deployment instead
       * of reusing an old iframe response cached by the browser.
       */
      const separator =
        APP_URL.includes("?")
          ? "&"
          : "?";

      return (
        APP_URL +
        separator +
        "shell=1&_ts=" +
        Date.now()
      );
    }


    function showApp() {
      window.setTimeout(
        function () {
          shell.classList.add(
            "ready"
          );

          loader.setAttribute(
            "aria-busy",
            "false"
          );
        },
        60
      );
    }


    frame.addEventListener(
      "load",
      function () {
        if (
          frame.src ===
          "about:blank"
        ) {
          return;
        }

        showApp();
      }
    );


    /*
     * Load only the real Apps Script page.
     * The Shell does not add a second menu or alter the internal UI.
     */
    frame.src =
      latestAppUrl();
  </script>
</body>
</html>
